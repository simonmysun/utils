<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>截图合并工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- 页面标题和全局控制 -->
        <header class="header">
            <h1>截图合并工具</h1>
            <div class="global-controls">
                <div class="direction-control">
                    <label>
                        <input type="radio" name="direction" value="vertical" checked>
                        垂直拼接
                    </label>
                    <label>
                        <input type="radio" name="direction" value="horizontal">
                        水平拼接
                    </label>
                </div>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 左侧控制面板 (桌面端) -->
            <aside class="sidebar">
                <!-- 上传区域 -->
                <section class="upload-section">
                    <h3>添加图片</h3>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-placeholder">
                            <svg class="upload-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7,10 12,15 17,10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            <p>点击选择图片</p>
                            <p class="upload-hint">支持 PNG, JPG, WEBP 格式</p>
                        </div>
                        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                    </div>
                </section>

                <!-- 图片列表 -->
                <section class="image-list-section">
                    <h3>图片列表</h3>
                    <div class="image-list" id="imageList">
                        <div class="empty-state">
                            <p>暂无图片</p>
                        </div>
                    </div>
                </section>

                <!-- 智能合并控制 -->
                <section class="smart-merge-section">
                    <h3>智能合并</h3>
                    <div class="smart-controls">
                        <label class="checkbox-label">
                            <input type="checkbox" id="enableSmartMerge">
                            启用智能识别
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="autoRemoveHeader">
                            自动去除重复头部
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="autoRemoveFooter">
                            自动去除重复底部
                        </label>
                        <button class="btn btn-secondary" id="applySmartMerge">
                            应用智能建议
                        </button>
                    </div>
                </section>

                <!-- 导出控制 -->
                <section class="export-section">
                    <h3>导出设置</h3>
                    <div class="export-controls">
                        <button class="btn btn-primary" id="previewBtn">
                            预览最终效果
                        </button>
                        <button class="btn btn-success" id="downloadBtn">
                            下载合并图片
                        </button>
                    </div>
                </section>
            </aside>

            <!-- 主编辑区域 -->
            <div class="editor-area">
                <!-- 图片序列预览区 -->
                <section class="sequence-preview">
                    <h3>图片序列</h3>
                    <div class="sequence-container" id="sequenceContainer">
                        <div class="empty-sequence">
                            <p>请先上传图片</p>
                        </div>
                    </div>
                </section>

                <!-- 编辑工具区 -->
                <section class="edit-tools" id="editTools" style="display: none;">
                    <h3>编辑工具</h3>
                    <div class="tool-tabs">
                        <button class="tab-btn active" data-tab="crop">裁剪</button>
                        <button class="tab-btn" data-tab="transform">变换</button>
                    </div>
                    
                    <div class="tool-content">
                        <!-- 裁剪工具 -->
                        <div class="tool-panel active" id="cropTool">
                            <div class="crop-preview">
                                <div class="crop-image-container">
                                    <img id="cropPreviewImage" src="" alt="">
                                    <div class="crop-overlay">
                                        <div class="crop-handle crop-top"></div>
                                        <div class="crop-handle crop-bottom"></div>
                                        <div class="crop-handle crop-left"></div>
                                        <div class="crop-handle crop-right"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="crop-controls">
                                <div class="control-group">
                                    <label>上边距:</label>
                                    <input type="number" id="cropTop" min="0" value="0"> px
                                </div>
                                <div class="control-group">
                                    <label>下边距:</label>
                                    <input type="number" id="cropBottom" min="0" value="0"> px
                                </div>
                                <div class="control-group">
                                    <label>左边距:</label>
                                    <input type="number" id="cropLeft" min="0" value="0"> px
                                </div>
                                <div class="control-group">
                                    <label>右边距:</label>
                                    <input type="number" id="cropRight" min="0" value="0"> px
                                </div>
                            </div>
                        </div>

                        <!-- 变换工具 -->
                        <div class="tool-panel" id="transformTool">
                            <div class="transform-controls">
                                <div class="control-group">
                                    <label>旋转:</label>
                                    <button class="btn btn-small" id="rotateLeft">逆时针90°</button>
                                    <button class="btn btn-small" id="rotateRight">顺时针90°</button>
                                </div>
                                <div class="control-group">
                                    <label>翻转:</label>
                                    <button class="btn btn-small" id="flipHorizontal">水平翻转</button>
                                    <button class="btn btn-small" id="flipVertical">垂直翻转</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 最终预览区 -->
                <section class="final-preview" id="finalPreview" style="display: none;">
                    <h3>最终预览</h3>
                    <div class="preview-container">
                        <canvas id="previewCanvas"></canvas>
                    </div>
                </section>
            </div>
        </main>

        <!-- 移动端底部工具栏 -->
        <div class="mobile-toolbar">
            <button class="mobile-btn" id="mobileUpload">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7,10 12,15 17,10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                上传
            </button>
            <button class="mobile-btn" id="mobileEdit">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                编辑
            </button>
            <button class="mobile-btn" id="mobilePreview">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                预览
            </button>
            <button class="mobile-btn" id="mobileDownload">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7,10 12,15 17,10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                下载
            </button>
        </div>
    </div>

    <!-- 加载指示器 -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>处理中...</p>
        </div>
    </div>

    <!-- JavaScript模块 -->
    <script src="js/imageLoader.js"></script>
    <script src="js/imageProcessor.js"></script>
    <script src="js/smartMerger.js"></script>
    <script src="js/uiController.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
