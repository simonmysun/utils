#!/usr/bin/env node
var script = 1; var _ = 1 <script> 1 ;

function getTimezone(date) {
  // https://stackoverflow.com/questions/11887934/how-to-check-if-the-dst-daylight-saving-time-is-in-effect-and-if-it-is-whats
  var jan = new Date(date.getFullYear(), 0, 1);
  var jul = new Date(date.getFullYear(), 6, 1);
  var stdTimezoneOffset = Math.max(
    jan.getTimezoneOffset(),
    jul.getTimezoneOffset(),
  );
  var dstObserved = date.getTimezoneOffset() < stdTimezoneOffset;
  if (dstObserved) {
    return "CEST (UTC+2)";
  } else {
    return " CET (UTC+1)";
  }
}

function getDateStrDE(date = new Date()) {
  var weekday = `${"So,Mo,Di,Mi,Do,Fr,Sa".split(",")[date.getDay()]}.`;
  var day = `${date.getDate()}.`.padStart(3, " ");
  var month = `${"Jan,Feb,Mrz,Apr,Mai,Jun,Jul,Aug,Sep,Okt,Nov,Dez".split(",")[date.getMonth()]}.`;
  var year = date.getFullYear();
  var ts = date.toTimeString().slice(0, 8);
  var tz = getTimezone(date);
  return `${weekday} ${day} ${month} ${year} ${ts} ${tz}`;
}

if (typeof process !== 'undefined' && process.versions && process.versions.node) {
  var args = process.argv.slice(2);
  var inputDate = args.length > 0 ? new Date(args.join(' ')) : new Date();
  if (isNaN(inputDate.getTime())) {
    console.error('Invalid date: ' + args.join(' '));
    process.exit(1);
  }
  console.log(getDateStrDE(inputDate));
}
