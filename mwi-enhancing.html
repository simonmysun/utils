<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>MWI 强化规划工具</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      .inputs {
        display: grid;
        grid-template-columns: repeat(21, 1fr);
        gap: 5px;
        margin-bottom: 20px;
      }
      .row {
        margin: 10px 0;
      }
      input[type="number"] {
        width: 100%;
      }
      #result {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
      }
      table,
      th,
      td {
        border: 1px solid #ccc;
        border-collapse: collapse;
        padding: 5px;
        text-align: center;
      }
      .faded {
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <h1>MWI 强化规划工具</h1>
    <p>
      输入你目前拥有的各等级装备数量（+0 到 +20），设定你要的 +20
      数量，以及从哪个等级开始使用贤者之镜。UI 为电脑屏幕设计。Bug 反馈：
      <a href="mailto:mail@maoyin.eu">mail@maoyin.eu</a> 。License：WTFPL。
    </p>

    <div class="row">
      <div class="inputs" id="gearInputs"></div>
    </div>

    <div class="row">
      需要的 +20 装备数量：<input
        type="number"
        id="target20"
        value="1"
        min="0"
      />
    </div>
    <div class="row">
      从 +x 开始使用贤者之镜：<input
        type="number"
        id="startX"
        value="10"
        min="2"
        max="19"
      />
    </div>
    <div class="row">
      最优合成路径：<input type="checkbox" id="optimizedPath" />
    </div>
    <button onclick="calculate()">计算</button>
    <button onclick="reset()">重置</button>

    <div id="result"></div>

    <script>
      const container = document.getElementById("gearInputs");
      for (let i = 0; i <= 20; i++) {
        const div = document.createElement("div");
        div.innerHTML = `+${i}: <input type='number' id='gear-${i}' min='0' value='0'>`;
        container.appendChild(div);
      }
      function reset() {
        for (let i = 0; i <= 20; i++) {
          document.getElementById(`gear-${i}`).value = 0;
        }
        document.getElementById("target20").value = 1;
        document.getElementById("startX").value = 10;
        document.getElementById("result").innerHTML = "";
        document.getElementById("optimizedPath").checked = false;
      }

      function calculate() {
        const target20 = Number(document.getElementById("target20").value);
        const startX = Number(document.getElementById("startX").value);
        const optimizedPath = document.getElementById("optimizedPath").checked;
        const range = Array.from(
          { length: 20 - startX + 2 },
          (_, i) => i + startX - 1,
        );

        const stock = [];
        for (let i = 0; i <= 20; i++)
          stock[i] = Number(document.getElementById(`gear-${i}`).value);

        const need = [];
        const enhanced = [];
        for (let i = 0; i <= 19; i++) {
          need[i] = 0;
          enhanced[i] = 0;
        }
        need[20] = target20;
        for (let i = 0; i <= 20; i++) need[i] += -stock[i];

        let res = `<h3>库存</h3>`;
        res += `<table>`;
        res += `<tr><th>${range
          .map((i) => `+${i}`)
          .join("</th><th>")}</th></tr>`;
        res += `<tr><td>${range
          .map((i) => stock[i])
          .join("</td><td>")}</td></tr>`;
        res += `</table>`;
        res += `<h3>需求推演</h3>`;
        res += `<table>`;
        res += `<tr><th>${range
          .map((i) => `+${i}`)
          .join("</th><th>")}</th></tr>`;
        res += `<tr><td>${range
          .map((i) => need[i])
          .join("</td><td>")}</td></tr>`;
        for (let n = 19; n >= startX; n--) {
          if (need[n + 1] > 0) {
            enhanced[n] += need[n + 1];
            need[n] += need[n + 1];
            need[n - 1] += need[n + 1];
            need[n + 1] -= need[n + 1];
          }
          res += `<tr><td>${range
            .map(
              (i) =>
                `${i <= n ? need[i] : `<span class="faded">${need[i]}</span>`}`,
            )
            .join("</td><td>")}</td></tr>`;
        }
        res += `</table>`;
        res += `<p><b>结论</b>：还需要 ${Math.max(0, need[startX - 1])} 个 +${
          startX - 1
        } 和 ${Math.max(0, need[startX])} 个 +${startX}。</p>`;
        if (optimizedPath) {
          let mergeQueue = [];
          let stockCopy = stock.slice();
          function mergeThrough(target) {
            if(stockCopy[target] > 0) {
              stockCopy[target] -= 1;
              return;
            }
            let demand = [];
            demand[-1] = target;
            if (target <= startX) {
              demand[target] = -1;
              demand[0] = -1;
              mergeQueue.push(demand);
            } else if (target === startX + 1) {
              demand[startX - 1] = 1;
              mergeThrough(startX - 1);
              demand[startX] = 1;
              mergeThrough(startX);
              demand[0] = 1;
              mergeQueue.push(demand);

            } else {
              for (let n = startX - 1; n < target - 1; n++) {
                if (n === startX) {
                  demand[n] = 2;
                  mergeThrough(n);
                  mergeThrough(n);
                } else {
                  demand[n] = 1;
                  mergeThrough(n);
                }
              }
              demand[0] = target - startX;
              mergeQueue.push(demand);
            }
          }
          mergeThrough(20);
          res += `<h3>合成步骤<small>（从初始库存开始）</small></h3>`;
          if(target20 === 1) {
            res += `<p>仅演示合成一个 +20 的过程以节约篇幅。</p>`;
          }
          res += `<table>`;
          res += `<tr><th>${[...range.map((i) => `+${i}`), "发生了什么？"].join(
            "</th><th>",
          )}</th></tr>`;
          res += `<tr><td>${[
            ...range.map(
              (i) =>
                `<span class="${stock[i] > 0 ? `` : `faded`}">${stock[i]}</span>`,
            ),
            "<span class=\"faded\">初始库存</span>",
          ].join("</td><td>")}</td></tr>`;
          let mirrorUsed = 0;
          for (const demand of mergeQueue) {
            res += `<tr><td>${[
              ...range.map(
                (i) =>
                  `<span class="${demand[i] === 0 || demand[i] === undefined ? `faded` : ``}">${demand[i] > 0 ? '-': (demand[i] < 0 ? '+': '')}${Math.abs(demand[i]) || 0}</span>`,
              ),
              `${demand[0] === -1 ? '普通强化' : `贤者之镜强化 +${startX}，目标 +${startX + demand[0]}`}`,
            ].join("</td><td>")}</td></tr>`;
            if (demand[0] === -1) {
              stock[demand[-1]] -= demand[demand[-1]] || 0;
            } else {
              for (let n = startX - 1; n < demand[-1]; n++) {
                stock[n] -= demand[n] || 0;
              }
              stock[demand[-1]] += 1;
            }
            mirrorUsed += demand[0] > 0 ? demand[0] : 0;
            res += `<tr><td>${[
              ...range.map(
                (i) =>
                  `<span class="${stock[i] > 0 ? `` : `faded`}">${stock[i]}</span>`,
              ),
              "<span class=\"faded\">合成后库存</span>",
            ].join("</td><td>")}</td></tr>`;
          }
          res += `</table>`;
          res += `<h3>贤者之镜使用总计：${mirrorUsed} 个</h3>`;
          if(target20 === 1) {
            const totalQueueOptimized = mergeQueue.length;
            const totalQueue = Math.max(0, need[startX - 1]) + Math.max(0, need[startX]) + enhanced.reduce((a, b) => a + b, 0);
            res += `<p>总队列数量：${totalQueueOptimized} / ${totalQueue} 个，节约 ${totalQueue - totalQueueOptimized} 个</p>`;
          }
        } else {
          res += `<h3>合成步骤<small>（假设以上需求已满足）</small></h3>`;
          res += `<table>`;
          res += `<tr><th>${[
            ...range.map((i) => `+${i}`),
            "红镜子",
            "发生了什么？",
          ].join("</th><th>")}</th></tr>`;
          for (let n = 0; n <= 20; n++) {
            if (need[n] > 0) stock[n] += need[n];
          }
          res += `<tr><td>${[
            ...range.map((i) => stock[i]),
            0,
            "满足以上需求后的库存数量",
          ].join("</td><td>")}</td></tr>`;
          let mirrorUsed = 0;
          for (let n = startX; n <= 19; n++) {
            stock[n - 1] -= enhanced[n];
            stock[n] -= enhanced[n];
            stock[n + 1] += enhanced[n];
            mirrorUsed += enhanced[n];
            res += `<tr><td>${[
              ...range.map(
                (i) =>
                  `${
                    i >= n ? stock[i] : `<span class="faded">${stock[i]}</span>`
                  }`,
              ),
              -enhanced[n],
              `${enhanced[n]} 个 +${n - 1} 和 +${n} 合成 +${n + 1}`,
            ].join("</td><td>")}</td></tr>`;
          }
          res += `</table>`;
          res += `<h3>贤者之镜使用总计：${mirrorUsed} 个</h3>`;
        }
        document.getElementById("result").innerHTML = res;
      }
    </script>
  </body>
</html>
